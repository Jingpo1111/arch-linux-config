general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.2
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 120
    font_family = Noto Sans
    position = 0, 230
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 22
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

# Profile picture
image {
    monitor =
    path = ~/Pictures/avatar.png
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, -30
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 18
    font_family = Noto Sans
    position = 0, -115
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = 26
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(20, 20, 35, 0.55)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(137, 180, 250, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    fail_text = <i>Wrong password</i>
    position = 0, -195
    halign = center
    valign = center
}

# Battery (bottom right)
label {
    monitor =
    text = cmd[update:30000] echo "Battery $(cat /sys/class/power_supply/BAT1/capacity)%"
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = Noto Sans
    position = -30, 30
    halign = right
    valign = bottom
}
